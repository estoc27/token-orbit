[package]
name = "orbit-hud"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "token-orbit"
path = "src/main.rs"

[dependencies]
orbit-core = { path = "../orbit-core" }
serde.workspace = true
serde_json.workspace = true
# eframe = egui + 네이티브 창(winit) + GPU 백엔드. WebView 없음.
eframe = { version = "0.29", default-features = false, features = ["glow"] }
egui = "0.29"
# eframe이 재수출하지 않아 직접 의존 — 창 제어용 실제 HWND 획득에 필요.
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# 트레이 아이콘 + 전역 단축키 (Tauri 플러그인 대체)
tray-icon = "0.19"
global-hotkey = "0.6"
